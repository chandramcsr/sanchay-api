# --extra-index-url in requirements.txt declares download.pytorch.org
# as a second package index (needed for the CPU-only torch build --
# see requirements.txt's own comment). uv's default index-strategy
# stops at the FIRST index containing any version of a package, which
# breaks resolution for anything (like requests, a transitive
# dependency of resend) that exists on both indexes at different
# versions. This tells uv to consider the best version across every
# declared index instead -- uv's own documented fix for that failure
# mode. Belongs here, not as an inline requirements.txt directive:
# uv lock's requirements.txt parser only accepts real requirement
# specifiers plus a small set of directives (-c/-e/-r,
# --extra-index-url) -- --index-strategy isn't one of them and fails
# to parse there, confirmed by the actual Vercel build error.
index-strategy = "unsafe-best-match"
